[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gh-stars-organizer"
version = "0.2.0"
description = "Deterministic, offline-first and conservative GitHub Star Lists organization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "gh-stars-organizer contributors"}]
dependencies = ["typer>=0.12.3", "rich>=13.7.1", "PyYAML>=6.0.1", "pydantic>=2.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.10", "build>=1.2"]

[project.scripts]
gh-stars-organizer = "gh_stars_organizer.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["gh_stars_organizer"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["gh_stars_organizer"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
